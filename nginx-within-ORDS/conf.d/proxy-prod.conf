upstream ords_backend {
    # Sesuaikan IP dan Port backend ExaCC yang aktif (misal port 443 atau 8080)
    ip_hash;
    server 10.119.32.246:443 max_fails=3 fail_timeout=10s;
    server 10.119.32.247:443 max_fails=3 fail_timeout=10s;
    server 10.119.32.248:443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name 10.119.36.50;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 10.119.36.50;
    
    server_tokens off;

    # Buffer & upload limits
    proxy_buffer_size           128k;
    proxy_buffers               4 256k;
    proxy_busy_buffers_size     256k;
    large_client_header_buffers 4 32k;
    client_header_buffer_size   32k;
    client_max_body_size        50m;

    # SSL configuration
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === SSL Config KHUSUS UPSTREAM (Nginx -> ExaCC Backend) ===
    proxy_ssl_verify off;
    proxy_ssl_server_name off;
    proxy_ssl_session_reuse on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_ciphers HIGH:!aNULL:!MD5;

    # === 1. Proteksi Path Sensitif / Admin ===
    location ~* ^/ords/(sql-developer|apex_admin|ords_admin|ords_util|internal|_dev|apex_util|admin|apexdbuat/_/sql|apexdbuat/sign-in|_/landing|apexdbuat/apex)(/|$) {
        deny all;
        return 403;
    }

    location ~* ^/ords/metadata-catalog {
        deny all;
        return 403;
    }

    # === 2. Reverse Proxy ORDS / APEX ===
    location /ords/ {
        proxy_pass https://ords_backend/ords/;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & HTTP 1.1 Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # === 3. Static Resources (/i/) ===
    location /i/ {
        proxy_pass https://ords_backend/i/;
        
        # Gunakan HTTP 1.1 untuk static asset pipeline
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # === 4. Health Check ===
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # === 5. Auto-Redirect Root URL ke Aplikasi APEX ===
    location = / {
        return 301 https://$host/ords/apexdbuat/r/bjktapp/bank-jakarta-portal;
    }

    location / {
        return 404;
    }
}
